<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hexly — hex-map editor</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Hexly — a hex-map editor for TTRPG worldbuilding." />
    <meta name="theme-color" content="#f1e5c7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c1a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preload" href="/fonts/marcellus-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/source-serif-4-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      Resolve the ColorScheme before first paint to avoid a flash. Mirrors
      ColorSchemeService: stored choice wins, else follow the OS preference.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('hexly-color-scheme');
          var astral = stored === 'astral' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.colorScheme = astral ? 'astral' : 'solar';
        } catch (e) {
          document.documentElement.dataset.colorScheme = 'solar';
        }
      })();
    </script>
    <!--
      Replay the World Theme (ADR-0076) last served for the World this URL names, so a reload back into
      it paints themed. Mirrors WorldThemeApplier's scope regex; the cache holds already-resolved
      custom properties, so this carries no logic of its own.
    -->
    <script>
      (function () {
        try {
          var route = /^\/(public\/w|w)\/([^/]+)/.exec(location.pathname);
          if (!route) return;
          var seg = route[2];
          var scope = route[1] + '/' + (route[1] === 'w' ? seg.slice(seg.lastIndexOf('-') + 1) : seg);
          var cached = JSON.parse(localStorage.getItem('hexly-world-theme') || '[]');
          for (var i = 0; i < cached.length; i++) {
            if (cached[i].scope !== scope) continue;
            var declarations = cached[i][document.documentElement.dataset.colorScheme] || {};
            for (var name in declarations) {
              document.documentElement.style.setProperty(name, declarations[name]);
            }
            return;
          }
        } catch (e) {
          /* No storage, no replay — the World read settles the Theme a moment later either way. */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

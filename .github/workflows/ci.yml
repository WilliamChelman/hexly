name: CI

on:
  push:
    branches:
      - main
      - beta
  pull_request:
  # Releases are cut manually: dispatch this workflow on main/beta to run the
  # real semantic-release + Docker publish. A push only dry-runs (see `release`).
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Persist the Nx task cache (skips unchanged tasks) plus Angular's esbuild
      # cache (speeds the builds that DO run). Angular only writes .angular/cache
      # in CI because apps/web sets cli.cache.environment "all". The SHA suffix
      # makes each run save a fresh entry (GH Actions cache is immutable per key);
      # restore-keys fall back to the latest prior entry. A per-job prefix keeps
      # build's and e2e's caches distinct so neither job's save is a no-op against
      # the other's identical key.
      - uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            .angular/cache
          key: ${{ runner.os }}-nx-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-build-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nx-

      # i18n-sync is the key-drift gate (issue #50): it type-checks the tool then
      # diffs every locale catalog against en.json. run-many invokes it for the
      # one project that defines it (web), failing the build on drift.
      # The custom ESLint rules are the guards for ADR-0020 (design tokens) and ADR-0045
      # (the EntityWrites and WorldWrites choke points). A rule whose AST selector is typo'd
      # matches nothing and passes silently, so the rules carry their own RuleTester suites.
      - run: pnpm test:eslint-rules

      # schema.ts is the single migration source of truth (ADR-0027): this fails the build on a
      # hand-authored migration or a schema change that never went through `pnpm db:generate`.
      - run: pnpm db:check

      - run: pnpm exec nx run-many -t lint test build i18n-sync

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Same cache strategy as the build job, under a distinct e2e prefix so this
      # job's web+api build (triggered by the e2e dependsOn) persists its own warm
      # cache. Falls back to any Nx cache (incl. build's) via the shared prefix.
      - uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            .angular/cache
          key: ${{ runner.os }}-nx-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-e2e-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nx-

      # Only chromium — the suite is a single-engine seam regression net (ADR-0009).
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web-e2e/playwright-report/
          retention-days: 7

  # Version preview: reports the version that would be released, without cutting
  # it. Runs on push to main/beta (post-merge) because a real preview needs the
  # true branch/event — semantic-release's env-ci short-circuits on pull_request
  # ("won't publish") and GitHub reserves GITHUB_* so a workflow can't spoof its
  # way out of that on a PR. Releases are cut only via the manual release job.
  release-preview:
    needs: [build, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # --dry-run publishes nothing, but on a push event semantic-release still runs
    # a git push --dry-run auth probe; the top-level contents:read would 403 it.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Release dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release --dry-run

  # Real release: only ever runs on a manual workflow_dispatch (on main/beta),
  # gated behind the same main+e2e checks a push runs.
  release:
    needs: [build, e2e]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup

      - name: Semantic release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV=$(git tag --sort=-version:refname | head -1)
          pnpm exec semantic-release
          NEXT=$(git tag --sort=-version:refname | head -1)
          if [ "$PREV" != "$NEXT" ] && [ -n "$NEXT" ]; then
            echo "tag=$NEXT" >> $GITHUB_OUTPUT
          fi

      - name: Log in to ghcr.io
        if: steps.release.outputs.tag
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.release.outputs.tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/williamchelman/hexly
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}

      - name: Set up Docker Buildx
        if: steps.release.outputs.tag
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.release.outputs.tag
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

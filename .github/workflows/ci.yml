name: CI

on:
  push:
    branches:
      - main
      - beta
  pull_request:
  # Releases are cut manually: dispatch this workflow on main/beta to run the
  # real semantic-release + Docker publish. A push only dry-runs (see `release`).
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Persist the Nx task cache (skips unchanged tasks) plus Angular's esbuild
      # cache (speeds the builds that DO run). Angular only writes .angular/cache
      # in CI because apps/web sets cli.cache.environment "all". The SHA suffix
      # makes each run save a fresh entry (GH Actions cache is immutable per key);
      # restore-keys fall back to the latest prior entry. A per-job prefix keeps
      # build's and e2e's caches distinct so neither job's save is a no-op against
      # the other's identical key.
      - uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            .angular/cache
          key: ${{ runner.os }}-nx-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-build-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nx-

      # i18n-sync is the key-drift gate (issue #50): it type-checks the tool then
      # diffs every locale catalog against en.json. run-many invokes it for the
      # one project that defines it (web), failing the build on drift.
      # The custom ESLint rules are the guards for ADR-0020 (design tokens) and ADR-0045
      # (the EntityWrites and WorldWrites choke points). A rule whose AST selector is typo'd
      # matches nothing and passes silently, so the rules carry their own RuleTester suites.
      - run: pnpm test:eslint-rules

      # schema.ts is the single migration source of truth (ADR-0027): this fails the build on a
      # hand-authored migration or a schema change that never went through `pnpm db:generate`.
      - run: pnpm db:check

      - run: pnpm exec nx run-many -t lint test build i18n-sync

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Same cache strategy as the build job, under a distinct e2e prefix so this
      # job's web+api build (triggered by the e2e dependsOn) persists its own warm
      # cache. Falls back to any Nx cache (incl. build's) via the shared prefix.
      - uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            .angular/cache
          key: ${{ runner.os }}-nx-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-e2e-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nx-

      # Only chromium — the suite is a single-engine seam regression net (ADR-0009).
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web-e2e/playwright-report/
          retention-days: 7

  # Version preview: reports the version that would be released, without cutting
  # it. Runs on push to main/beta (post-merge) because a real preview needs the
  # true branch/event — semantic-release's env-ci short-circuits on pull_request
  # ("won't publish") and GitHub reserves GITHUB_* so a workflow can't spoof its
  # way out of that on a PR. Releases are cut only via the manual release job.
  release-preview:
    needs: [build, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # --dry-run publishes nothing, but on a push event semantic-release still runs
    # a git push --dry-run auth probe; the top-level contents:read would 403 it.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Release dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release --dry-run

  # Real release: only ever runs on a manual workflow_dispatch (on main/beta),
  # gated behind the same main+e2e checks a push runs. Cuts the release as a
  # *draft* (`draftRelease` in release.config.js) — `publish-release` below
  # undrafts it once the desktop artifacts are attached (#328).
  release:
    needs: [build, e2e]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    # The tag the desktop matrix labels its artifacts with, and the release it
    # attaches them to. Empty when there was nothing to release.
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup

      - name: Semantic release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV=$(git tag --sort=-version:refname | head -1)
          pnpm exec semantic-release
          NEXT=$(git tag --sort=-version:refname | head -1)
          if [ "$PREV" != "$NEXT" ] && [ -n "$NEXT" ]; then
            echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ghcr.io
        if: steps.release.outputs.tag
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.release.outputs.tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/williamchelman/hexly
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}

      - name: Set up Docker Buildx
        if: steps.release.outputs.tag
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.release.outputs.tag
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # One release is one place (#328, ADR-0070): the Desktop App's installers land on the
  # same GitHub Release as the container image above. One runner per platform, because
  # each installs its own platform's native binaries — `sharp`'s prebuilds and libvips
  # are per-platform optional dependencies and `better-sqlite3` is rebuilt against the
  # local toolchain — so nothing here cross-builds.
  desktop:
    needs: release
    if: needs.release.outputs.tag
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      # No sibling is cancelled: each platform's leg is the only signal that platform's
      # download exists, and a cancelled leg would be indistinguishable from a broken one.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            ext: dmg
            wrapper: ''
          - runner: windows-latest
            ext: exe
            wrapper: ''
          # Electron opens a real window, even for a smoke check, and a runner has no display.
          - runner: ubuntu-latest
            ext: AppImage
            wrapper: xvfb-run -a

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          # `desktop:package` rebuilds better-sqlite3 for Electron's ABI, so this job's
          # node_modules must never answer for — or be saved under — the test jobs' key.
          native-abi: electron

      # Builds the SPA and the shell, rebuilds the native addon for Electron, runs
      # electron-builder, then *opens the artifact and uses it*: a World created, an image
      # thumbnailed, a password hashed (#327). The native modules are the packaging risk
      # and a build cannot vouch for them, so that check is this leg's gate.
      - name: Package the Desktop App
        shell: bash
        env:
          # What the artifacts are named and what the app reports as its version; without
          # it every release's downloads would be `0.0.0` (electron-builder.config.js).
          HEXLY_VERSION: ${{ needs.release.outputs.tag }}
        run: ${{ matrix.wrapper }} pnpm exec nx run desktop:package

      - name: Attach the installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          EXT: ${{ matrix.ext }}
        # Matched by the version `artifactName` puts in the name, so this uploads what *this*
        # run built rather than whatever `dist/desktop` happens to hold — and a glob that
        # matched nothing fails the leg instead of leaving the release one download short.
        # `gh` finds the draft by tag: the releases-by-tag endpoint hides drafts, and gh
        # falls back to listing them.
        run: |
          shopt -s nullglob
          artifacts=(dist/desktop/*-"${TAG#v}"-*."$EXT")
          if [ "${#artifacts[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .$EXT for $TAG in dist/desktop, found: ${artifacts[*]:-none}"
            exit 1
          fi
          gh release upload "$TAG" "${artifacts[0]}" --clobber

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-package-report-${{ matrix.runner }}
          path: apps/desktop-e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # The one step that makes a release visible, and it runs only if every leg above did —
  # so a release is never published short a download, a failed platform leaving a draft
  # and a red run instead (#328). Retry with "Re-run failed jobs", which reuses this tag;
  # a fresh dispatch would find nothing left to release.
  publish-release:
    needs: [release, desktop]
    if: needs.release.outputs.tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        # The downloads are unsigned, so every platform warns about them, and a user who
        # meets that warning with no explanation concludes the download is broken. So the
        # workaround travels *with* the release rather than only in the README.
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          gh release view "$TAG" --json body -q .body > "$NOTES"
          printf '\n---\n\n' >> "$NOTES"
          cat .github/desktop-download-notes.md >> "$NOTES"
          gh release edit "$TAG" --notes-file "$NOTES" --draft=false

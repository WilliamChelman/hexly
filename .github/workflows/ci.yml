name: CI

on:
  push:
    branches:
      - main
      - beta
  pull_request:
  # Releases are cut manually: dispatch this workflow on main/beta to run the
  # real semantic-release + Docker publish. A push only dry-runs (see `release`).
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# What the lint/test/build jobs below run their target over. A PR only needs the projects its
# diff reaches; a push to main/beta and a release dispatch cover the whole workspace. This is
# the substitute for a warm task cache: Nx keys its local cache in a sqlite db that lives
# outside `.nx/cache` and is scoped to the machine id, so `actions/cache` cannot restore it
# (nx.dev/troubleshooting/unknown-local-cache) — every run starts cold no matter what.
# `pull_request.base.sha` can trail the branch tip the merge ref was built from, which only ever
# widens the diff, never narrows it. Left unquoted at each use site on purpose — it has to split
# into two words for the `affected` case.
env:
  SCOPE: >-
    ${{ github.event_name == 'pull_request' && format('affected --base={0}', github.event.pull_request.base.sha) ||
    'run-many' }}

jobs:
  # The workspace-level gates plus every project's lint. No Angular cache: ESLint reads none.
  lint:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 so `affected` can diff against the PR's base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # The custom ESLint rules are the guards for ADR-0020 (design tokens) and ADR-0045
      # (the EntityWrites and WorldWrites choke points). A rule whose AST selector is typo'd
      # matches nothing and passes silently, so the rules carry their own RuleTester suites.
      - run: pnpm test:eslint-rules

      # schema.ts is the single migration source of truth (ADR-0027): this fails the build on a
      # hand-authored migration or a schema change that never went through `pnpm db:generate`.
      - run: pnpm db:check

      # i18n-sync is the key-drift gate (issue #50): it type-checks the tool then diffs every
      # locale catalog against en.json. Only web defines it, and its inputs name every lib's
      # catalogs, so a catalog edit anywhere reaches it through `affected`.
      - run: pnpm exec nx $SCOPE -t lint i18n-sync

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # vitest-angular bundles each Angular project before running it, so the unit tests want
      # the same esbuild cache the builds do. See the e2e job for the key strategy.
      - uses: actions/cache@v4
        with:
          path: .angular/cache
          key: ${{ runner.os }}-ng-test-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ng-test-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-ng-

      - run: pnpm exec nx $SCOPE -t test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - uses: actions/cache@v4
        with:
          path: .angular/cache
          key: ${{ runner.os }}-ng-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ng-build-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-ng-

      - run: pnpm exec nx $SCOPE -t build

  # The suite is serial by construction — one seeded DB per server, reset between tests
  # (ADR-0009) — so shards, not workers, are how it gets faster. Every shard boots its own
  # servers and rebuilds web+api, so the fixed cost per shard bounds how far this pays.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      # A red shard is the signal; cancelling its siblings would hide the rest of the failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Angular's esbuild cache, which speeds the web build this job's `dependsOn` triggers.
      # Angular only writes .angular/cache in CI because apps/web sets cli.cache.environment
      # "all". The SHA (and here the shard, since a key is immutable and the shards would race
      # for one) makes each run save a fresh entry; restore-keys fall back to the newest prior
      # one, and the per-job prefix keeps one job's save from being a no-op against another's.
      # `.nx/cache` is deliberately absent: Nx keys its task cache in a sqlite db that lives
      # outside that directory and is scoped to the machine id, so a restored cache is rejected
      # as "Unrecognized Cache Artifacts" and every task re-runs. `affected` is what keeps CI
      # off untouched projects instead.
      - uses: actions/cache@v4
        with:
          path: .angular/cache
          key: ${{ runner.os }}-ng-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}-${{ matrix.shard }}
          restore-keys: |
            ${{ runner.os }}-ng-e2e-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-ng-

      # Only chromium — the suite is a single-engine seam regression net (ADR-0009).
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: pnpm exec nx e2e web-e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/web-e2e/playwright-report/
          retention-days: 7

  # Version preview: reports the version that would be released, without cutting
  # it. Runs on push to main/beta (post-merge) because a real preview needs the
  # true branch/event — semantic-release's env-ci short-circuits on pull_request
  # ("won't publish") and GitHub reserves GITHUB_* so a workflow can't spoof its
  # way out of that on a PR. Releases are cut only via the manual release job.
  release-preview:
    needs: [lint, test, build, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # --dry-run publishes nothing, but on a push event semantic-release still runs
    # a git push --dry-run auth probe; the top-level contents:read would 403 it.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Release dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release --dry-run

  # Real release: only ever runs on a manual workflow_dispatch (on main/beta),
  # gated behind the same checks a push runs. Cuts a draft; `publish-release`
  # undrafts it once the desktop artifacts are attached (#328).
  release:
    needs: [lint, test, build, e2e]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    # The tag the desktop matrix labels its artifacts with; empty when there was
    # nothing to release.
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup

      - name: Semantic release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV=$(git tag --sort=-version:refname | head -1)
          pnpm exec semantic-release
          NEXT=$(git tag --sort=-version:refname | head -1)
          if [ "$PREV" != "$NEXT" ] && [ -n "$NEXT" ]; then
            echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ghcr.io
        if: steps.release.outputs.tag
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.release.outputs.tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/williamchelman/hexly
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}

      - name: Set up Docker Buildx
        if: steps.release.outputs.tag
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.release.outputs.tag
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # One release is one place (#328, ADR-0070): the Desktop App's installers land on the same
  # GitHub Release as the container image above. One runner per platform — `sharp`'s prebuilds
  # and `better-sqlite3` are per-platform native binaries, so nothing here cross-builds.
  desktop:
    needs: release
    if: needs.release.outputs.tag
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      # Each leg is one platform's download; a cancelled sibling would be indistinguishable
      # from a broken one.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            ext: dmg
            wrapper: ''
          - runner: windows-latest
            ext: exe
            wrapper: ''
          # Electron opens a real window, even for a smoke check, and a runner has no display.
          - runner: ubuntu-latest
            ext: AppImage
            wrapper: xvfb-run -a

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          # `desktop:package` rebuilds better-sqlite3 for Electron's ABI, so this
          # node_modules cannot share the test jobs' cache key.
          native-abi: electron

      # Packages, then opens the artifact and uses it (#327): the native modules are the
      # packaging risk and a build cannot vouch for them.
      - name: Package the Desktop App
        shell: bash
        env:
          # Without it every release's downloads are named `0.0.0` (electron-builder.config.js).
          HEXLY_VERSION: ${{ needs.release.outputs.tag }}
        run: ${{ matrix.wrapper }} pnpm exec nx run desktop:package

      - name: Attach the installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          EXT: ${{ matrix.ext }}
        # Version-matched glob, so this uploads what *this* run built and a glob that matched
        # nothing fails the leg. `gh` finds the draft by listing — the releases-by-tag endpoint
        # hides drafts.
        run: |
          shopt -s nullglob
          artifacts=(dist/desktop/*-"${TAG#v}"-*."$EXT")
          if [ "${#artifacts[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .$EXT for $TAG in dist/desktop, found: ${artifacts[*]:-none}"
            exit 1
          fi
          gh release upload "$TAG" "${artifacts[0]}" --clobber

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-package-report-${{ matrix.runner }}
          path: apps/desktop-e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Runs only if every leg above did, so a release is never published short a download (#328).
  # Retry with "Re-run failed jobs", which reuses this tag; a fresh dispatch would find nothing
  # left to release.
  publish-release:
    needs: [release, desktop]
    if: needs.release.outputs.tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        # The downloads are unsigned and every platform warns about them, so the workaround
        # travels with the release rather than only in the README.
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          gh release view "$TAG" --json body -q .body > "$NOTES"
          printf '\n---\n\n' >> "$NOTES"
          cat .github/desktop-download-notes.md >> "$NOTES"
          gh release edit "$TAG" --notes-file "$NOTES" --draft=false
